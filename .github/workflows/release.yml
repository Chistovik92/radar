name: Release

# Выпуск после зелёного CI на main (с 5.0). Код в main без релиза ломает
# `install.sh --versions`: установщик берёт список версий из релизов.
# Раньше тег и релиз ставились руками, и выпуски терялись.
#
# Выпускается каждая версия истории без тега, на своём коммите (с 5.6),
# старше всех выпущенных; повторный пуш без смены номера релиз не плодит.
# Текст — tools/release_notes.py: docs/releases/<версия>.md или RELEASES.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Только после успешного CI именно пуша в main, а не PR из форка.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Проверка согласованности номера
        run: python tools/lint_release.py

      # Все версии истории без тега — по релизу на каждую, на её собственном
      # коммите (с 5.6). Два выпуска, слитые одним PR, иначе теряли бы
      # младший: тег ставился только на текущую версию.
      - name: Теги и релизы
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force --quiet
          python tools/release_notes.py pending $(git tag -l 'v*') > "$RUNNER_TEMP/pending"
          if [ ! -s "$RUNNER_TEMP/pending" ]; then
            echo "Невыпущенных версий нет"
            exit 0
          fi
          last="$(tail -n 1 "$RUNNER_TEMP/pending" | cut -d' ' -f1)"
          while read -r version sha; do
            if gh release view "v$version" >/dev/null 2>&1; then
              echo "Релиз v$version уже есть — пропускаю"
              continue
            fi
            python tools/release_notes.py body "$version" > "$RUNNER_TEMP/notes.md"
            title="$(python tools/release_notes.py title "$version")"
            latest="--latest=false"
            [ "$version" = "$last" ] && latest="--latest"
            gh release create "v$version" \
              --target "$sha" \
              --title "$title" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              "$latest"
            echo "Выпущен v$version на $sha"
          done < "$RUNNER_TEMP/pending"
