name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Тесты логики
        run: python -m unittest discover -s tests -v

      # Каждый файл отдельно: в общем прогоне тест может ехать на заглушках,
      # поставленных соседом, и падать в одиночку. Ровно так восемнадцать
      # ошибок из-за bs4 не были видны на машине разработчика.
      - name: Каждый файл тестов в одиночку
        run: |
          for file in tests/test_*.py; do
            name="tests.$(basename "$file" .py)"
            echo "--- $name"
            python -m unittest "$name" || exit 1
          done

      - name: Импорт всех модулей с заглушками
        run: python tools/stubcheck.py

      - name: Сверка перекрёстных имён
        run: python tools/lint_names.py

      - name: Неопределённые имена
        run: python tools/lint_undefined.py

      - name: Совместимость с Python из образа
        run: python tools/lint_pyversion.py

      - name: Dockerfile согласован с .dockerignore
        run: python tools/lint_docker.py

      - name: docker compose разбирается без переменных
        run: |
          cp .env.example .env
          docker compose config --quiet
          rm -f .env

      - name: Подпись автора на месте
        run: python tools/stamp_headers.py --check

      - name: Порядок функций в install.sh
        run: python tools/lint_shellorder.py

      - name: Синтаксис bash
        run: bash -n install.sh && bash -n tools/install.template.sh

      - name: install.sh соответствует исходникам
        run: |
          # Сборщик выставляет install.sh право на исполнение, а в индексе
          # git файл может лежать с обычными правами. Сравнивать нужно
          # содержимое, а не биты доступа, иначе проверка падает на
          # «old mode 100644 / new mode 100755», хотя текст совпадает.
          git config core.fileMode false
          python tools/build_installer.py
          git diff --exit-code -- install.sh \
            || { echo "install.sh устарел: выполните python3 tools/build_installer.py"; exit 1; }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Сборка образа
        run: docker build -t radar_image:ci .
